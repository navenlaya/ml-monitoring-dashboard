services:
  backend:
    build: .
    container_name: ml-monitoring-backend
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./model:/app/model
      - ml_database:/app/database
    environment:
      - DATABASE_URL=sqlite:///./database/ml_monitoring.db
      - PYTHONPATH=/app
    networks:
      - ml-monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ml-monitoring-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - ml-monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optional: Add a reverse proxy for production
  nginx-proxy:
    image: nginx:alpine
    container_name: ml-monitoring-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - ml-monitoring
    profiles:
      - production
    restart: unless-stopped

volumes:
  ml_database:
    driver: local

networks:
  ml-monitoring:
    driver: bridge
    name: ml-monitoring-network 