services:
  # Backend API Service
  - type: web
    name: ml-monitoring-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd model && python train_model.py && cd ..
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
    healthCheckPath: /docs

  # Frontend Service  
  - type: web
    name: ml-monitoring-frontend
    env: static
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ml-monitoring-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
